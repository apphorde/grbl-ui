name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm exec eslint -- public/app.js server.mjs serial-bridge.mjs serial-bridge.test.mjs playwright.config.js e2e/serial-mock.spec.js
      - run: npm exec prettier -- --check --print-width 120 public/app.js public/index.html public/style.css server.mjs serial-bridge.mjs serial-bridge.test.mjs playwright.config.js e2e/serial-mock.spec.js package.json eslint.config.mjs
